<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020b12" />
    <title>GamRace</title>
    <link rel="icon" type="image/png" href="assets/brand/gamrace-icon.png" />
    <link rel="stylesheet" href="styles.css?v=wallet-balances-1" />
  </head>
  <body class="game-page" data-authenticated="false">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="mobile-menu-header">
          <strong>Menu</strong>
          <button class="mobile-menu-close" type="button" aria-label="Close menu">×</button>
        </div>
        <nav class="primary-nav">
          <a class="nav-link" href="index.html"><img class="nav-icon nav-icon-home" src="assets/icons/navigation/home.png" alt="" aria-hidden="true" />Home</a>
          <a class="nav-link active" href="index.html?tab=house" data-mobile-menu-action="house"><img class="nav-icon nav-icon-house" src="assets/icons/navigation/house-mode.png" alt="" aria-hidden="true" />House</a>
          <a class="nav-link" href="index.html?tab=player" data-mobile-menu-action="player"><img class="nav-icon nav-icon-player" src="assets/icons/navigation/player-mode.png" alt="" aria-hidden="true" />Player</a>
          <a class="nav-link" href="index.html?filter=slot"><img class="nav-icon nav-icon-slots" src="assets/icons/navigation/slots.png" alt="" aria-hidden="true" />Slots</a>
          <a class="nav-link" href="index.html?filter=live"><img class="nav-icon nav-icon-live-games" src="assets/icons/navigation/live-games.png" alt="" aria-hidden="true" />Live Games</a>
          <a class="nav-link" href="index.html?filter=provider"><img class="nav-icon nav-icon-providers" src="assets/icons/navigation/providers.png" alt="" aria-hidden="true" />Providers</a>
          <a class="nav-link" href="index.html#promotions"><img class="nav-icon nav-icon-promotions" src="assets/icons/navigation/promotions.png" alt="" aria-hidden="true" />Promotions</a>
          <a class="nav-link" href="index.html#rewards" data-mobile-menu-action="rewards"><img class="nav-icon nav-icon-rewards" src="assets/icons/navigation/rewards.png" alt="" aria-hidden="true" />Rewards</a>
          <a class="nav-link" href="index.html#vip"><img class="nav-icon nav-icon-vip" src="assets/icons/navigation/vip.png" alt="" aria-hidden="true" />VIP</a>
          <a class="nav-link" href="index.html#affiliates"><img class="nav-icon nav-icon-affiliates" src="assets/icons/navigation/affiliates.png" alt="" aria-hidden="true" />Affiliates</a>
        </nav>
      </aside>

      <main class="main-content game-main" aria-label="Game area">
        <header class="topbar">
          <div class="topbar-inner">
            <a class="topbar-brand" href="index.html" aria-label="GamRace home">
              <img class="brand-full" src="assets/brand/gamrace-logo-large.png" alt="GamRace" />
              <img class="brand-icon" src="assets/brand/gamrace-icon.png" alt="" aria-hidden="true" />
            </a>
            <div class="account-actions">
              <button class="utility rewards" type="button" aria-label="Rewards"><img class="utility-icon" src="assets/icons/navigation/rewards.png" alt="" aria-hidden="true" /></button>
              <button class="utility balance" id="header-balance" type="button" aria-label="Balance"><span class="balance-value">$0.00</span></button>
              <button class="utility wallet" type="button"><span class="utility-label">Wallet</span></button>
            </div>
            <div class="auth-actions">
              <button class="auth login" type="button">Sign In</button>
              <button class="auth register" type="button">Sign Up</button>
            </div>
            <button class="profile-action" type="button" aria-label="Profile"><span aria-hidden="true">[20]</span><span class="profile-label">Profile</span></button>
          </div>
        </header>

        <div class="game-rail">
          <section class="mines-game" id="mines-game" hidden aria-label="Mines">
            <div class="mines-stage">
              <section class="mines-controls" aria-label="Mines controls">
                <div class="mines-mode-tabs" role="tablist" aria-label="Game mode">
                  <button class="mines-mode-tab active" type="button" role="tab" aria-selected="true" data-mines-mode="manual">Manual</button>
                  <button class="mines-mode-tab" type="button" role="tab" aria-selected="false" data-mines-mode="auto">Auto</button>
                </div>

                <div class="mines-control-stack" data-mode-panel="manual">
                  <label class="mines-field">
                    <span><strong>Bet Amount</strong><small id="bet-usd-value">$0.00</small></span>
                    <span class="bet-input-shell"><span class="bet-currency">$</span><input id="bet-amount" type="number" min="0.01" step="0.01" inputmode="decimal" value="0.00" aria-label="Bet amount" /><button type="button" data-bet-action="half">½</button><button type="button" data-bet-action="double">2×</button></span>
                  </label>
                  <label class="mines-field">
                    <span><strong>Mines</strong><small>1–24</small></span>
                    <span class="select-shell"><select id="mine-count" aria-label="Number of mines"></select><span aria-hidden="true">⌄</span></span>
                  </label>
                  <button class="mines-primary-button" id="mines-action" type="button" disabled>Bet</button>
                </div>

                <div class="mines-control-stack" data-mode-panel="auto" hidden>
                  <label class="mines-field">
                    <span><strong>Bet Amount</strong><small>Per round</small></span>
                    <span class="bet-input-shell"><span class="bet-currency">$</span><input id="auto-bet-amount" type="number" min="0.01" step="0.01" inputmode="decimal" value="0.00" aria-label="Automatic bet amount" /><button type="button" data-auto-bet-action="half">½</button><button type="button" data-auto-bet-action="double">2×</button></span>
                  </label>
                  <label class="mines-field"><span><strong>Mines</strong><small>1–24</small></span><span class="select-shell"><select id="auto-mine-count" aria-label="Automatic number of mines"></select><span aria-hidden="true">⌄</span></span></label>
                  <div class="auto-selection-summary"><span>Selected Tiles</span><strong id="auto-selected-count">0 / 22</strong></div>
                  <label class="mines-field">
                    <span><strong>Number of Bets</strong><small>1–100</small></span>
                    <span class="bet-input-shell single-input"><input id="auto-round-count" type="number" min="1" max="100" step="1" value="10" aria-label="Number of automatic bets" /></span>
                  </label>
                  <button class="mines-primary-button" id="auto-action" type="button" disabled>Start Autoplay</button>
                </div>
                <p class="mines-balance-message" id="mines-balance-message" role="status" aria-live="polite" hidden></p>
              </section>

              <section class="mines-board-panel" aria-label="Mines board">
                <div class="mines-board" id="mines-board" role="grid" aria-label="Five by five Mines board"></div>
                <div class="mines-result" id="mines-result" hidden aria-live="assertive"><span id="result-payout">$0.00</span></div>
              </section>

              <footer class="mines-stage-footer">
                <div aria-label="Game tools"><span>[1]</span><span>[2]</span><span>[3]</span><span>[4]</span><span>[5]</span></div>
                <span>GamRace</span>
                <span class="fairness-label">Fair Play [6]</span>
              </footer>
            </div>

            <section class="mines-history" aria-labelledby="history-heading">
              <div class="history-toolbar">
                <div class="history-tabs" role="tablist" aria-label="Mines results">
                  <button class="history-tab active" id="history-heading" type="button" role="tab" aria-selected="true" data-history-view="top">Top Wins</button>
                  <button class="history-tab" type="button" role="tab" aria-selected="false" data-history-view="lucky">Lucky Wins</button>
                </div>
                <label class="history-period"><span class="sr-only">Results period</span><select id="history-period"><option>Lifetime</option><option>Today</option><option>This week</option></select></label>
              </div>
              <div class="history-table-wrap">
                <table class="history-table">
                  <thead><tr><th>Rank</th><th>User</th><th>Date</th><th>Bet Amount</th><th>Multiplier</th><th>Payout</th></tr></thead>
                  <tbody aria-label="Results not available yet">
                    <tr class="history-skeleton" aria-hidden="true"><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td></tr>
                    <tr class="history-skeleton" aria-hidden="true"><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td></tr>
                    <tr class="history-skeleton" aria-hidden="true"><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td></tr>
                    <tr class="history-skeleton" aria-hidden="true"><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td></tr>
                    <tr class="history-skeleton" aria-hidden="true"><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td><td><i></i></td></tr>
                  </tbody>
                </table>
              </div>
            </section>
          </section>
          <section class="game-blank-state" id="game-blank-state" aria-label="Game coming later"></section>
        </div>
      </main>
    </div>
    <nav class="mobile-tabbar" aria-label="Mobile navigation">
      <button class="mobile-tab-action" type="button" data-mobile-action="menu" aria-expanded="false"><img class="mobile-tab-icon" src="assets/icons/navigation/menu.png" alt="" aria-hidden="true" /><strong>Menu</strong></button>
      <button class="mobile-tab-action" type="button" data-mobile-action="search"><img class="mobile-tab-icon" src="assets/icons/navigation/search.png" alt="" aria-hidden="true" /><strong>Search</strong></button>
      <button class="mobile-tab-action" type="button" data-mobile-action="house" aria-pressed="false"><img class="mobile-tab-icon" src="assets/icons/navigation/house-mode.png" alt="" aria-hidden="true" /><strong>House</strong></button>
      <button class="mobile-tab-action" type="button" data-mobile-action="player" aria-pressed="false"><img class="mobile-tab-icon" src="assets/icons/navigation/player-mode.png" alt="" aria-hidden="true" /><strong>Player</strong></button>
      <button class="mobile-tab-action" type="button" data-mobile-action="rewards"><img class="mobile-tab-icon" src="assets/icons/navigation/rewards.png" alt="" aria-hidden="true" /><strong>Rewards</strong></button>
      <button class="mobile-tab-action" type="button" data-mobile-action="chat"><img class="mobile-tab-icon" src="assets/icons/navigation/chat.png" alt="" aria-hidden="true" /><strong>Chat</strong></button>
    </nav>
    <script src="mines.js?v=wallet-balances-1" defer></script>
    <script src="mobile-nav.js?v=navigation-icons-1" defer></script>
    <script type="module" src="firebase-auth.js?v=wallet-transactions-1"></script>
    <script src="vendor/qrcode.js?v=1.4.4"></script>
    <script type="module" src="wallet.js?v=wallet-addresses-3"></script>
  </body>
</html>
