name = "gamrace-wallet-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
FIREBASE_PROJECT_ID = "gamrace"
ALLOWED_ORIGINS = "https://gamrace.com,https://www.gamrace.com,http://localhost:4173,http://localhost:8080"
OXAPAY_API_BASE = "https://api.oxapay.com/v1"
PUBLIC_BASE_URL = "https://gamrace-wallet-api.gamracecom.workers.dev"
ADMIN_SESSION_TTL_MINUTES = "240"
ADMIN_SESSION_VERSION = "1"

[[d1_databases]]
binding = "DB"
database_name = "gamrace-wallet"
database_id = "42046267-53ba-49c0-b05a-6cb3846abccf"

